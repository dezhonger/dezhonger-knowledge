map $host $site_root {
  hostnames;
  default                           /usr/share/nginx/html/knowledge;
  knowledge.dezhonger.com          /usr/share/nginx/html/knowledge;
  guwen.dezhonger.com              /usr/share/nginx/html/guwen;
  zmq.dezhonger.com                /usr/share/nginx/html/zmq;
  rby.dezhonger.com                /usr/share/nginx/html/rby;
  biology.dezhonger.com            /usr/share/nginx/html/biology;
  geography.dezhonger.com          /usr/share/nginx/html/geography;
  physics.dezhonger.com            /usr/share/nginx/html/physics;
  chemistry.dezhonger.com          /usr/share/nginx/html/chemistry;
}

server {
  listen 80 default_server;
  server_name knowledge.dezhonger.com guwen.dezhonger.com zmq.dezhonger.com
              rby.dezhonger.com
              biology.dezhonger.com geography.dezhonger.com
              physics.dezhonger.com chemistry.dezhonger.com;
  root $site_root;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location / {
    try_files $uri $uri.html $uri/ /index.html;
  }
}

# History Atlas serves only files that were actually built. Retired learning
# routes and mistyped detail URLs must return 404 instead of the homepage.
server {
  listen 80;
  server_name history.dezhonger.com;
  root /usr/share/nginx/html/history;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|woff2?)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
